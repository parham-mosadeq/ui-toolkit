<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/styles/styles.css" />
    <title>Lit Element - ui tool kit</title>
    <!-- Exporting all modules at once to use/show in ui - browser -->
    <script type="module" src="./src/main.ts"></script>
    <link href="/src/styles/styles.css" rel="stylesheet" />
  </head>
  <body>
    <my-element name="World"></my-element>
    <button-atom label="Submit" color="red" library="tailwind"></button-atom>
    <button-atom
      label="Cancel"
      color="red"
      onclick=""
      library=""
      disabled></button-atom>
    <script>
      document
        .querySelector("button-atom")
        ?.addEventListener("button-atom", (event) => {
          console.log("Button clicked:", event.detail.label);
          alert(`Button clicked: ${event.detail.label}`);
        });
    </script>
  </body>
</html>
